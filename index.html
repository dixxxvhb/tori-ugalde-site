<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tori Ugalde</title>
<meta name="description" content="Tori Ugalde, choreographer, teacher and dancer in Orlando, Florida. Competition choreography, classes, master classes and costumes.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Tori Ugalde">
<meta property="og:description" content="Choreographer, teacher and dancer. Orlando, Florida.">
<meta property="og:image" content="brand/og-image-1200x630.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body class="loading">

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="./">tori ugalde</a>
    <nav class="nav" aria-label="Main">
      <a href="#work">Work</a>
      <a href="media.html">Media</a>
      <a href="resume.html">Resume</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <div>
          <p class="bday" id="bday" hidden></p>
          <h1 class="hero-name">tori ugalde</h1>
          <p class="meta hero-roles" data-t="roles"></p>
        </div>
        <div>
          <p class="hero-lede" data-t="lede"></p>
          <div class="hero-ctas">
            <a class="btn" href="#work">See my work</a>
            <a class="btn ghost" href="resume.html">Resume</a>
          </div>
        </div>
      </div>
      <div class="hero-film">
        <video id="hero-video" autoplay muted loop playsinline preload="auto" poster="images/hero/hero-poster.jpg" aria-label="A piece choreographed by Tori">
          <source src="images/hero/hero-loop.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="wrap">
      <div class="hats">
        <div class="hat"><p class="n">choreographer</p><h3 data-t="hat1_h"></h3><p data-t="hat1_p"></p></div>
        <div class="hat"><p class="n">teacher</p><h3 data-t="hat2_h"></h3><p data-t="hat2_p"></p></div>
        <div class="hat"><p class="n">dancer</p><h3 data-t="hat3_h"></h3><p data-t="hat3_p"></p></div>
      </div>
    </div>
  </section>

  <section class="section band-dark" id="work" data-list="works">
    <div class="wrap">
      <div class="section-head">
        <div>
          <p class="meta">My choreography</p>
          <h2 style="margin-top:10px" data-t="work_h"></h2>
          <p data-t="work_p"></p>
        </div>
        <a class="link" href="media.html?f=choreo">Every video</a>
      </div>
      <div class="works" id="works"></div>
    </div>
  </section>

  <section class="section" id="teaching">
    <div class="wrap teach">
      <div>
        <h2 style="margin-bottom:12px" data-t="teach_h"></h2>
        <p style="color:var(--ink-2);margin-bottom:28px" data-t="teach_p"></p>
        <ul class="rows" id="teach-rows"></ul>
        <p style="margin-top:24px"><button class="link" id="watch-teach" style="border:0;cursor:pointer;font:inherit;font-weight:500">Watch me teach</button></p>
      </div>
      <img id="teach-img" src="images/photos/2026-07-tori-teaching-03.jpg" alt="Tori teaching across the floor at the DWD ProSeries summer intensive" loading="lazy">
    </div>
  </section>

  <section class="section" id="dancer">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-t="stage_h"></h2>
          <p data-t="stage_p"></p>
        </div>
        <a class="link" href="media.html?f=dance">All photos</a>
      </div>
      <div class="strip" id="strip"></div>
    </div>
  </section>

  <section class="section" id="costumes">
    <div class="wrap teach">
      <div>
        <h2 style="margin-bottom:12px" data-t="costume_h"></h2>
        <p style="color:var(--ink-2)" data-t="costume_p"></p>
      </div>
      <img id="costume-img" src="images/photos/stepsisters-costumes.jpg" alt="Stepsisters Lament on stage, in the costumes Tori built" loading="lazy">
    </div>
  </section>

  <section class="section" data-list="looking">
    <div class="wrap">
      <div class="looking">
        <h2 data-t="looking_h"></h2>
        <ul id="looking"></ul>
      </div>
    </div>
  </section>

  <section class="section" data-list="quotes">
    <div class="wrap">
      <div class="quotes" id="quotes"></div>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="wrap contact">
      <h2 data-t="contact_h"></h2>
      <div class="contact-lines" id="contact-lines"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="wordmark">tori ugalde</span>
    <span>Choreographer and teacher, Orlando, Florida</span>
  </div>
</footer>

<script src="js/viewer.js"></script>
<script src="js/site-content.js"></script>
<script src="js/home.js"></script>
</body>
</html>
