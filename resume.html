<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tori Ugalde Resume</title>
<meta name="description" content="Resume: Tori Ugalde, choreographer, teacher and dancer in Orlando, Florida.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  body.loading .cv { opacity: 0; }
  .cv { transition: opacity .25s; }
  .cv { max-width: 860px; margin: 40px auto 80px; padding: 56px 64px; background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 18px; }
  .cv-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 22px; border-bottom: 2px solid var(--lav); margin-bottom: 8px; }
  .cv-head h1 { font-family: var(--script); font-weight: 400; font-size: 64px; line-height: .9; }
  .cv-head .who { font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-2); margin-top: 22px; }
  .cv-contact { text-align: right; font-size: 14px; line-height: 1.7; }
  .cv-contact a { text-decoration: none; }
  .cv h2 { font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-2); margin: 26px 0 10px; }
  .job { margin-bottom: 14px; }
  .job-top { display: flex; justify-content: space-between; gap: 16px; }
  .job-top b { font-weight: 500; }
  .job-top span { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
  .job .role { font-size: 15px; color: var(--ink-2); }
  .job ul { margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.55; }
  .job li { margin: 2px 0; }
  table.ch { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.ch th { text-align: left; font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px 6px 0; }
  table.ch td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.ch td:first-child { font-weight: 500; }
  
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
  .two ul { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; }
  .cv-actions { max-width: 860px; margin: 32px auto 0; padding: 0 24px; display: flex; gap: 12px; justify-content: flex-end; }
  @media (max-width: 760px) {
    .cv { margin: 16px; padding: 28px 20px; }
    .cv-head { flex-direction: column; align-items: start; }
    .cv-contact { text-align: left; }
    .two { grid-template-columns: 1fr; }
    table.ch .st { display: none; }
    .cv-actions { justify-content: flex-start; }
  }
  @media print {
    @page { size: letter; margin: 0.45in 0.5in; }
    .site-header, .cv-actions, .site-footer { display: none !important; }
    body { font-size: 12.5px; line-height: 1.45; }
    .cv { box-shadow: none; margin: 0; padding: 0; max-width: none; border-radius: 0; }
    .cv-head h1 { font-size: 46px; }
    .cv h2 { margin: 14px 0 6px; }
    .job { margin-bottom: 8px; break-inside: avoid; }
    .job ul, .two ul, table.ch { font-size: 11.5px; line-height: 1.4; }
    table.ch td { padding: 4px 8px 4px 0; }
    a { text-decoration: none; }
  }
</style>
</head>
<body class="loading" style="background:#FBFAFC">
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="./">tori ugalde</a>
    <nav class="nav" aria-label="Main">
      <a href="./#work">Work</a>
      <a href="media.html">Media</a>
      <a href="resume.html" aria-current="page">Resume</a>
      <a href="./#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="cv-actions"><button class="btn" onclick="window.print()">Save as PDF</button></div>

<article class="cv">
  <div class="cv-head">
    <div>
      <h1>tori ugalde</h1>
      <p class="who" data-t="resume_who"></p>
    </div>
    <div class="cv-contact" id="cv-contact"></div>
  </div>
  <div id="cv-jobs-wrap"><h2>Experience</h2><div id="cv-jobs"></div></div>
  <div id="cv-ch-wrap">
    <h2>Choreography</h2>
    <table class="ch">
      <thead><tr><th>Piece</th><th>Style</th><th class="st">Studio</th><th>Recognition</th></tr></thead>
      <tbody id="cv-ch"></tbody>
    </table>
  </div>
  <div class="two">
    <div id="cv-tr-wrap"><h2>Training and performance</h2><ul id="cv-tr"></ul></div>
    <div id="cv-sk-wrap"><h2>Skills</h2><ul id="cv-sk"></ul></div>
  </div>
  <div id="cv-ref-wrap"><h2>References</h2><p style="font-size:15px" data-t="references"></p></div>
</article>

<footer class="site-footer">
  <div class="wrap"><span class="wordmark">tori ugalde</span><span>Choreographer and teacher, Orlando, Florida</span></div>
</footer>
<script src="js/site-content.js"></script>
<script>
(async function () {
  const { esc, ok } = SiteContent;
  const $ = s => document.querySelector(s);
  setTimeout(() => document.body.classList.remove('loading'), 6000);
  const c = await SiteContent.load(), T = c.text;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t] || ''; });
  const ig = String(T.instagram || '').replace(/^@/, '');
  const site = location.origin + location.pathname.replace(/resume\.html$/, '');
  $('#cv-contact').innerHTML = [esc(T.city || ''),
    ok.email(T.email) ? `<a href="mailto:${esc(T.email)}">${esc(T.email)}</a>` : '',
    ok.ig(ig) ? `<a href="https://www.instagram.com/${esc(ig)}/">@${esc(ig)}</a>` : '',
    `<a href="${esc(site)}">${esc(site.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</a>`].filter(Boolean).join('<br>');
  const jobs = c.jobs.filter(j => j.org);
  $('#cv-jobs').innerHTML = jobs.map(j => `<div class="job"><div class="job-top"><b>${esc(j.org)}</b><span>${esc(j.dates || '')}</span></div>
    ${j.role ? `<div class="role">${esc(j.role)}</div>` : ''}
    <ul>${String(j.bullets || '').split(/\n/).map(x => x.trim()).filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  const ch = c.works.filter(w => w.resume && w.title);
  $('#cv-ch').innerHTML = ch.map(w => `<tr><td>${esc(w.title)}</td><td>${esc(w.style || '')}</td><td class="st">${esc(w.studio || '')}</td><td>${esc([w.award, w.costumes ? 'Costumes by ' + w.costumes + '.' : ''].filter(Boolean).join(' '))}</td></tr>`).join('');
  const li = rows => rows.filter(r => r.text).map(r => `<li>${esc(r.text)}</li>`).join('');
  $('#cv-tr').innerHTML = li(c.training); $('#cv-sk').innerHTML = li(c.skills);
  $('#cv-jobs-wrap').hidden = !jobs.length; $('#cv-ch-wrap').hidden = !ch.length;
  $('#cv-tr-wrap').hidden = !c.training.some(r => r.text); $('#cv-sk-wrap').hidden = !c.skills.some(r => r.text);
  $('#cv-ref-wrap').hidden = !T.references;
  document.body.classList.remove('loading');
})();
</script>
</body>
</html>
