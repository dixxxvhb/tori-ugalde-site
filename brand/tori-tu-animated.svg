      26%  { stroke-dashoffset: 1000; fill-opacity: 0; }
      46%  { stroke-dashoffset: 0;    fill-opacity: 0; }
      52%  { stroke-dashoffset: 0;    fill-opacity: 1; }
      90%  { stroke-dashoffset: 0;    fill-opacity: 1; }
      100% { stroke-dashoffset: 0;    fill-opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .t, .u { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    }
  </style>
