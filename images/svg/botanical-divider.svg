<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" fill="none">
  <!-- Center leaf cluster -->
  <g transform="translate(200,20)" opacity="0.28">
    <!-- Three overlapping leaves pointing up/out -->
    <ellipse cx="0" cy="-9" rx="3" ry="7" fill="#2D5A3D" transform="rotate(0)"/>
    <ellipse cx="0" cy="-9" rx="3" ry="7" fill="#2D5A3D" opacity="0.85" transform="rotate(-30)"/>
    <ellipse cx="0" cy="-9" rx="3" ry="7" fill="#2D5A3D" opacity="0.85" transform="rotate(30)"/>
    <!-- Center stem -->
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#8B6F47" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Left branch -->
  <path d="M193,20 C178,20 165,17 148,18 C131,19 118,21 98,20 C78,19 58,21 38,19 C22,18 12,20 4,20"
        stroke="#8B6F47" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- Left leaves along branch — alternating above/below -->
  <ellipse cx="170" cy="14" rx="7" ry="3" fill="#2D5A3D" opacity="0.22" transform="rotate(-15,170,14)"/>
  <ellipse cx="155" cy="23" rx="6.5" ry="2.8" fill="#2D5A3D" opacity="0.18" transform="rotate(12,155,23)"/>
  <ellipse cx="138" cy="14" rx="6.5" ry="3" fill="#8B6F47" opacity="0.2" transform="rotate(-10,138,14)"/>
  <ellipse cx="122" cy="23" rx="6" ry="2.8" fill="#2D5A3D" opacity="0.2" transform="rotate(8,122,23)"/>
  <ellipse cx="105" cy="15" rx="6" ry="2.8" fill="#2D5A3D" opacity="0.18" transform="rotate(-8,105,15)"/>
  <ellipse cx="88" cy="23" rx="6" ry="2.8" fill="#8B6F47" opacity="0.18" transform="rotate(10,88,23)"/>
  <ellipse cx="70" cy="15" rx="5.5" ry="2.5" fill="#2D5A3D" opacity="0.18" transform="rotate(-6,70,15)"/>
  <ellipse cx="54" cy="23" rx="5" ry="2.3" fill="#2D5A3D" opacity="0.16" transform="rotate(8,54,23)"/>
  <ellipse cx="36" cy="16" rx="5" ry="2.3" fill="#8B6F47" opacity="0.16" transform="rotate(-5,36,16)"/>

  <!-- Right branch (mirror) -->
  <path d="M207,20 C222,20 235,17 252,18 C269,19 282,21 302,20 C322,19 342,21 362,19 C378,18 388,20 396,20"
        stroke="#8B6F47" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- Right leaves along branch -->
  <ellipse cx="230" cy="14" rx="7" ry="3" fill="#2D5A3D" opacity="0.22" transform="rotate(15,230,14)"/>
  <ellipse cx="245" cy="23" rx="6.5" ry="2.8" fill="#2D5A3D" opacity="0.18" transform="rotate(-12,245,23)"/>
  <ellipse cx="262" cy="14" rx="6.5" ry="3" fill="#8B6F47" opacity="0.2" transform="rotate(10,262,14)"/>
  <ellipse cx="278" cy="23" rx="6" ry="2.8" fill="#2D5A3D" opacity="0.2" transform="rotate(-8,278,23)"/>
  <ellipse cx="295" cy="15" rx="6" ry="2.8" fill="#2D5A3D" opacity="0.18" transform="rotate(8,295,15)"/>
  <ellipse cx="312" cy="23" rx="6" ry="2.8" fill="#8B6F47" opacity="0.18" transform="rotate(-10,312,23)"/>
  <ellipse cx="330" cy="15" rx="5.5" ry="2.5" fill="#2D5A3D" opacity="0.18" transform="rotate(6,330,15)"/>
  <ellipse cx="346" cy="23" rx="5" ry="2.3" fill="#2D5A3D" opacity="0.16" transform="rotate(-8,346,23)"/>
  <ellipse cx="364" cy="16" rx="5" ry="2.3" fill="#8B6F47" opacity="0.16" transform="rotate(5,364,16)"/>
</svg>
